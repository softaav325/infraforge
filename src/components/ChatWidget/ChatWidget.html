<!-- Chat Widget Container -->
<div id="chat-widget">
    <!-- Open/Close Button -->
    <button id="chat-widget-button">
        Chat
    </button>

    <!-- Chat Window -->
    <div id="chat-window" style="display: none;">
        <!-- Header -->
        <div id="chat-header">
            <span>Support InfraForge</span>
            <button id="chat-close-button">&times;</button>
        </div>

        <!-- Messages List -->
        <div id="chat-messages">
            <!-- Example messages -->
            <div class="message bot">Здравствуйте! Чем я могу вам помочь?</div>
            <div class="message user">Привет! Расскажите о проекте.</div>
        </div>

        <!-- Input Area -->
        <form id="chat-input-form">
            <input type="text" id="chat-input-field" placeholder="Inter messege..." required>
            <button type="submit" id="chat-send-button">
                Send
            </button>
        </form>
    </div>
</div>
